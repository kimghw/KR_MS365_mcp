[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kr-ms365-mcp"
version = "0.1.0"
description = "MS365 MCP server suite (Outlook/Calendar/OneNote/OneDrive/Teams/Todo/Time)"
requires-python = ">=3.12"
dependencies = [
    "aiohttp",
    "python-dotenv",
    "pydantic>=2",
    "requests",
    "PyYAML",
    # mcp 2.x 는 `Server.list_tools` 를 없앴다 — handlers.py 의 build_mcp_server() 가
    # 기동 시점에 AttributeError 로 죽는다. 2026-09-16 샌드박스 검증에서 6개 서버가
    # 전부 깨져서 드러났다(호스트에는 1.29.0 이 깔려 있어 보이지 않던 결함).
    # 2.x 로 올리려면 SDK 이관이 먼저다.
    "mcp>=1.29,<2",
    # fastapi 는 REST 서버(server_rest.py) 폐지로 런타임 의존이 사라졌다 (2026-08-12).
    "starlette",
    "uvicorn",
    # zoneinfo 는 OS 시간대 DB 를 쓴다 — Windows 에는 없어서 mcp_time 이 ZoneInfoNotFoundError 로 죽는다.
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
# editor extra 는 mcp_editor 삭제(2026-08-12)와 함께 제거됐다.
# 첨부파일 변환기 (mcp_outlook / mcp_file_handler)
converters = [
    "python-docx",
    "python-pptx",
    "openpyxl",
    "pandas",
    "olefile",
    "Pillow",
    "pytesseract",
    # 아래 4개는 코드에서 실제로 import 하지만 기존 목록에 누락돼 있었다.
    "pdfplumber",   # mcp_file_handler, mcp_outlook
    "pdf2image",    # mcp_file_handler
    "pyhwp",        # mcp_file_handler (HWP 변환)
    "pyhwpx",       # mcp_outlook (HWP 변환)
]
# mcp_onenote/onenote_agent.py 의 요약 기능. try/except ImportError 로 감싸져 있어 선택 사항이다.
agent = [
    "claude-code-sdk",
]

# 개발 도구는 extra 가 아니라 dependency-group 이다 (PEP 735).
# `uv sync` 가 dev 그룹을 기본으로 깔아 주므로 따로 지정할 필요가 없고,
# 배포물(wheel)의 extra 목록을 개발 도구로 오염시키지 않는다.
[dependency-groups]
dev = [
    "pytest",
    # 다수 테스트가 @pytest.mark.asyncio 를 쓴다. --strict-markers 와 함께면
    # 이 패키지가 없을 때 수집 단계에서 "unknown marker asyncio" 로 실패한다.
    "pytest-asyncio",
    "ruff",
    "black",
]

# ---------------------------------------------------------------------------
# 패키지 탐색
# ---------------------------------------------------------------------------
# flat-layout(프로젝트 루트에 top-level 패키지가 여러 개) 이므로 setuptools 자동 탐색이
# "Multiple top-level packages discovered in a flat-layout" 오류로 중단된다.
# 아래처럼 include/exclude 를 명시해 탐색 대상을 고정한다.
#
# namespaces = true 인 이유:
#   mcp_outlook/ 에는 __init__.py 가 없다(PEP 420 네임스페이스 패키지).
#   false 로 두면 두 패키지가 통째로 누락된다.
[tool.setuptools.packages.find]
where = ["."]
include = [
    "core*",
    "session*",
    "mcp_common*",
    "mcp_outlook*",
    "mcp_calendar*",
    "mcp_teams*",
    "mcp_onedrive*",
    "mcp_onenote*",
    "mcp_todo*",
    "mcp_time*",
    "mcp_file_handler*",
    # mcp_editor 는 2026-08-12 자로 삭제됐다(코드 생성 폐지). 도구 계약은
    # spec/param_spec/<도메인>.yaml 이 갖고, @mcp_service 와 schema_normalize 는
    # mcp_common 으로 이관했다. 자세한 건 spec/spec_도구정의.md 참조.
]
exclude = [
    # 테스트
    "tests*", "test*",
    "*.tests", "*.tests.*",
    "*.test", "*.test.*",
    # 문서 / 산출물 / 백업
    "docs*", "*.docs", "*.docs.*",
    "output*", "downloads*", "database*", "cloudflare*", "venv*",
    "*.backup", "*.backup.*",
    "*.legacy_backup", "*.legacy_backup.*",
    "*__pycache__*",
]
namespaces = true

# session/auth_manager.py 가 `from callback_server import CallbackServer` 로 참조하는
# 루트 단일 모듈. 패키지가 아니므로 py-modules 로 따로 선언해야 설치본에 들어간다.
[tool.setuptools]
py-modules = ["callback_server"]

# 코드가 런타임에 읽는 데이터 파일 (wheel/sdist 에 동봉)
# 주의: spec/param_spec/<도메인>.yaml 은 **런타임 필수**다(도구 계약의 유일한 원본).
# 패키지 밖에 있어 wheel 에 동봉되지 않으므로, 설치본으로 돌릴 때는 환경변수
# MCP_PARAM_SPEC_DIR 로 위치를 알려줘야 한다. 소스 트리에서 실행하면 자동 해석된다.
[tool.setuptools.package-data]
"mcp_outlook" = ["graph_api_schemas/*.json"]
"mcp_onenote" = ["*.yaml"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = [
    "mcp_common/tests",
    "mcp_outlook/tests",
    "mcp_onedrive/tests",
    "mcp_onenote/tests",
    "mcp_teams/tests",
    "mcp_calendar/tests",
    "mcp_time/tests",
    "mcp_file_handler/tests",
    "session/tests",
]
addopts = "-ra --strict-markers"
# @pytest.mark.asyncio 를 매 테스트에 붙이지 않아도 코루틴 테스트가 실행되도록.
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Windows 인코딩 대응
#  - 소스/리포트 파일은 UTF-8 로 고정한다.
#  - 콘솔(stdout/stderr) 인코딩은 pytest 설정으로 바꿀 수 없어서
#    루트 conftest.py 에서 sys.stdout.reconfigure(encoding="utf-8") 로 처리한다.
#    (기본 cp949/cp1252 콘솔에서 테스트가 한글을 print 하면 UnicodeEncodeError 로 죽는다.)
#  - 위 conftest.py 없이 실행할 때는 PYTHONUTF8=1 환경변수를 쓸 것.
#  (pytest 는 `encoding` 옵션을 모른다 — 넣으면 매 실행 경고가 뜨므로 두지 않는다.)

filterwarnings = [
    "default",
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [
    "venv",
    "output",
    "downloads",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort (import 정렬)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
# E402: sys.path 수정 후 import하는 패턴이 필요한 경우 허용
# E501: line-length 는 formatter 에 맡긴다
# B008: FastAPI/Depends 스타일의 기본 인자 호출 허용
ignore = ["E402", "E501", "B008"]

[tool.ruff.lint.per-file-ignores]
# 테스트는 sys.path 조작 + 미사용 import 가 흔하다
"**/test/**" = ["E402", "F401"]
"**/tests/**" = ["E402", "F401"]

[tool.black]
line-length = 120
target-version = ["py312"]
