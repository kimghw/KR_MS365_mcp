# Teams MCP — 도구 계약의 단일 원본.
#
# 이 파일이 곧 API 사양이다. inputSchema·기본값·필수여부는 기동 시
# mcp_common.param_spec 가 여기서 파생시킨다 (미리 구워 둔 산출물 없음).
# 형식 설명: mcp_common/param_spec.py 모듈 docstring
# 사양서: spec/spec_도구정의.md
#
# 전환 근거 (2026-08-12): 이전에는 server_stream.py / server_stdio.py 두 파일에
# 인라인 MCP_TOOLS 가 복사돼 있었고 설명이 서로 달랐다. 실제 런타임(HTTP 5003)이
# 노출하던 server_stream.py 판본을 그대로 옮겼다 — 설명 문구는 손대지 않았다.
# 핸들러에 하드코딩돼 있던 기본값(limit 50, prefix "[claude]", content_type "text")도
# 여기로 올렸다.
#
# user_email 은 스키마상 단순 문자열이지만, 핸들러가 mcp_common.user_resolver 로
# 기본 사용자를 해석해 서비스에 넘긴다(그 정책은 코드에 남는다).

server:
  name: teams
  version: "1.0.0"
  port: 5003
  description: "Teams 채팅·채널 조회/전송 및 한글 이름 DB 관리. Graph API 인증 필요."

tools:
  - name: handler_teams_list_chats
    description: "Teams 채팅 목록 조회"
    service: TeamsService.list_chats
    params:
      - name: user_email
        type: string
        required: false
        expose: tool
        description: "사용자 이메일 (선택, 미지정시 기본 사용자)"
      - name: limit
        type: integer
        required: false
        expose: tool
        default: 50
        description: "조회 개수"

  - name: handler_teams_get_chat
    description: "Teams 특정 채팅 정보 조회"
    service: TeamsService.get_chat
    params:
      - name: chat_id
        type: string
        required: true
        expose: tool
        description: "채팅 ID"
      - name: user_email
        type: string
        required: false
        expose: tool
        description: ""

  - name: handler_teams_get_chat_messages
    description: "Teams 채팅 메시지 목록 조회"
    service: TeamsService.get_chat_messages
    params:
      - name: chat_id
        type: string
        required: false
        expose: tool
        description: "채팅 ID (없으면 Notes)"
      - name: limit
        type: integer
        required: false
        expose: tool
        default: 50
        description: ""
      - name: user_email
        type: string
        required: false
        expose: tool
        description: ""

  - name: handler_teams_send_chat_message
    description: "Teams 채팅에 메시지 전송"
    service: TeamsService.send_chat_message
    params:
      - name: content
        type: string
        required: true
        expose: tool
        description: "메시지 본문"
      - name: chat_id
        type: string
        required: false
        expose: tool
        description: ""
      - name: prefix
        type: string
        required: false
        expose: tool
        default: "[claude]"
        description: ""
      - name: content_type
        type: string
        required: false
        expose: tool
        default: "text"
        enum: ["text", "html"]
        description: ""
      - name: user_email
        type: string
        required: false
        expose: tool
        description: ""

  - name: handler_teams_list_teams
    description: "사용자가 속한 팀 목록 조회"
    service: TeamsService.list_teams
    params:
      - name: user_email
        type: string
        required: false
        expose: tool
        description: ""

  - name: handler_teams_list_channels
    description: "팀의 채널 목록 조회"
    service: TeamsService.list_channels
    params:
      - name: team_id
        type: string
        required: true
        expose: tool
        description: ""
      - name: user_email
        type: string
        required: false
        expose: tool
        description: ""

  - name: handler_teams_get_channel_messages
    description: "채널 메시지 목록 조회"
    service: TeamsService.get_channel_messages
    params:
      - name: team_id
        type: string
        required: true
        expose: tool
        description: ""
      - name: channel_id
        type: string
        required: true
        expose: tool
        description: ""
      - name: limit
        type: integer
        required: false
        expose: tool
        default: 50
        description: ""
      - name: user_email
        type: string
        required: false
        expose: tool
        description: ""

  - name: handler_teams_send_channel_message
    description: "채널에 메시지 전송"
    service: TeamsService.send_channel_message
    params:
      - name: team_id
        type: string
        required: true
        expose: tool
        description: ""
      - name: channel_id
        type: string
        required: true
        expose: tool
        description: ""
      - name: content
        type: string
        required: true
        expose: tool
        description: ""
      - name: content_type
        type: string
        required: false
        expose: tool
        default: "text"
        enum: ["text", "html"]
        description: ""
      - name: user_email
        type: string
        required: false
        expose: tool
        description: ""

  - name: handler_teams_get_message_replies
    description: "메시지 답글 목록 조회"
    service: TeamsService.get_message_replies
    params:
      - name: team_id
        type: string
        required: true
        expose: tool
        description: ""
      - name: channel_id
        type: string
        required: true
        expose: tool
        description: ""
      - name: message_id
        type: string
        required: true
        expose: tool
        description: ""
      - name: user_email
        type: string
        required: false
        expose: tool
        description: ""

  - name: handler_teams_save_korean_name
    description: "채팅방의 한글 이름을 DB에 저장 (단일)"
    service: TeamsService.save_korean_name
    params:
      - name: topic_kr
        type: string
        required: true
        expose: tool
        description: ""
      - name: chat_id
        type: string
        required: false
        expose: tool
        description: ""
      - name: topic_en
        type: string
        required: false
        expose: tool
        description: ""
      - name: user_email
        type: string
        required: false
        expose: tool
        description: ""

  - name: handler_teams_save_korean_names_batch
    description: "여러 채팅방의 한글 이름을 한 번에 DB에 저장"
    service: TeamsService.save_korean_names_batch
    params:
      # 원래 인라인 스키마에는 items({topic_en, topic_kr}) 가 있었으나 param_spec 은
      # 중첩 items 를 표현하지 않는다. 형식은 아래 description 이 그대로 설명한다.
      - name: names
        type: array
        required: true
        expose: tool
        description: '[{"topic_en": "...", "topic_kr": "..."}] 배열'
        items:
          type: object
          properties:
            topic_en:
              type: string
            topic_kr:
              type: string
      - name: user_email
        type: string
        required: false
        expose: tool
        description: ""

  - name: handler_teams_find_chat_by_name
    description: "사용자 이름으로 채팅 검색 (한글/영문)"
    service: TeamsService.find_chat_by_name
    params:
      - name: recipient_name
        type: string
        required: true
        expose: tool
        description: ""
      - name: user_email
        type: string
        required: false
        expose: tool
        description: ""

  - name: handler_teams_sync_chats
    description: "채팅 목록을 DB에 동기화"
    service: TeamsService.sync_chats
    params:
      - name: limit
        type: integer
        required: false
        expose: tool
        default: 50
        description: ""
      - name: user_email
        type: string
        required: false
        expose: tool
        description: ""

  - name: handler_teams_get_chats_without_korean
    description: "한글 이름이 없는 채팅 목록 조회"
    service: TeamsService.get_chats_without_korean
    params:
      - name: user_email
        type: string
        required: false
        expose: tool
        description: ""
